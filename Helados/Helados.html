<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAR ALDEA BELLA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
        }
        header div {
            flex-grow: 1; /* Permite que el div ocupe el espacio restante */
            text-align: center; /* Centra el texto dentro del div */
        }
        .go-home-button img {
            width: 50px;
            height: 50px;
        }
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 40px auto;
            overflow: hidden;
        }
        .carousel {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-item {
            min-width: 100%;
            text-align: center;
        }
        .carousel-item img {
            width: 60%;
            border-radius: 10px;
        }
        .carousel-item h3 {
            font-size: 1.2em;
            margin-top: 10px;
        }
        .carousel-item p {
            font-size: 1.1em;
            color: #E60012;
            font-weight: bold;
        }
        .buttons {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }
        .buttons button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 0 10px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.2em;
        }
        .buttons button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="go-home-button">
            <img src="../Imagenes/Iconos/Icono INICIO.jpg" alt="Volver al Inicio">
        </a>
        <div>"HELADOS"</div>
    </header>

    <div class="carousel-container">
        <div class="carousel" id="carousel">
            <div class="carousel-item">
                <img src="../Helados/Fotos Helados/Calippo Cola.jpg" alt="Calippo Cola">
                <h3>Calippo Cola</h3>
                <p>0,00 €</p>
            </div>
            <div class="carousel-item">
                <img src="../Helados/Fotos Helados/Calippo Fresa.png" alt="Calippo Fresa">
                <h3>Calippo Fresa</h3>
                <p>0,00 €</p>
            </div>
            <!-- Resto de los elementos del carrusel -->
        </div>
        <div class="buttons">
            <button id="prevBtn">&#10094;</button>
            <button id="nextBtn">&#10095;</button>
        </div>
    </div>

    <script>
        let currentIndex = 0;
        const items = document.querySelectorAll('.carousel-item');
        const totalItems = items.length;

        // Botón siguiente
        document.getElementById('nextBtn').addEventListener('click', function() {
            if (currentIndex < totalItems - 1) {
                currentIndex++;
            } else {
                currentIndex = 0;
            }
            updateCarousel();
        });

        // Botón anterior
        document.getElementById('prevBtn').addEventListener('click', function() {
            if (currentIndex > 0) {
                currentIndex--;
            } else {
                currentIndex = totalItems - 1;
            }
            updateCarousel();
        });

        // Función para actualizar el carrusel
        function updateCarousel() {
            const newTransformValue = -currentIndex * 100;
            document.querySelector('.carousel').style.transform = `translateX(${newTransformValue}%)`;
        }

        // Gestos táctiles (swipe)
        let startX = 0;
        let endX = 0;

        document.querySelector('.carousel').addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX; // Almacena la posición inicial al tocar
        });

        document.querySelector('.carousel').addEventListener('touchmove', function(e) {
            endX = e.touches[0].clientX; // Almacena la posición final al mover el dedo
        });

        document.querySelector('.carousel').addEventListener('touchend', function() {
            if (startX > endX + 30) {
                // Deslizar a la izquierda (siguiente imagen)
                if (currentIndex < totalItems - 1) {
                    currentIndex++;
                } else {
                    currentIndex = 0;
                }
            } else if (startX < endX - 30) {
                // Deslizar a la derecha (imagen anterior)
                if (currentIndex > 0) {
                    currentIndex--;
                } else {
                    currentIndex = totalItems - 1;
                }
            }
            updateCarousel();
        });
    </script>

</body>
</html>
