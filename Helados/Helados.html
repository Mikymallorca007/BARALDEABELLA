<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAR ALDEA BELLA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .go-home-button img, .info-button img {
            width: 50px;
            height: 50px;
        }
        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 40px auto;
            overflow: hidden;
        }
        .carousel {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        .carousel-item {
            min-width: 100%;
            text-align: center;
        }
        .carousel-item img {
            width: 60%;
            border-radius: 10px;
        }
        .carousel-item h3 {
            font-size: 1.2em;
            margin-top: 10px;
        }
        .carousel-item p {
            font-size: 1.1em;
            color: #E60012;
            font-weight: bold;
        }
        /* Estilos para la modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
        }
        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            max-width: 90%;
            max-height: 90%;
        }
        .close {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 30px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <a href="../index.html" class="go-home-button">
        <img src="../Imagenes/Iconos/Icono INICIO.jpg" alt="Volver al Inicio">
    </a>
    <div>"HELADOS"</div>
    <a class="info-button" onclick="openModal()">
        <img src="../Imagenes/Iconos/Icono INFO.jpg" alt="Información">
    </a>
</header>

<div class="carousel-container">
    <div class="carousel" id="carousel">
        <div class="carousel-item">
            <img src="../Helados/Fotos Helados/Calippo Cola.jpg" alt="Calippo Cola">
            <h3>Calippo Cola</h3>
            <p>0,00 €</p>
        </div>
        <div class="carousel-item">
            <img src="../Helados/Fotos Helados/Calippo Fresa.jpg" alt="Calippo Fresa">
            <h3>Calippo Fresa</h3>
            <p>0,00 €</p>
        </div>
        <div class="carousel-item">
            <img src="../Helados/Fotos Helados/Calippo Lima.png" alt="Calippo Lima">
            <h3>Calippo Lima</h3>
            <p>0,00 €</p>
        </div>
        <!-- Agrega más imágenes aquí -->
    </div>
</div>

<!-- Modal -->
<div id="imageModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img class="modal-content" id="modalImage" src="../Imagenes/Info.jpg" alt="Información">
</div>

<script>
    function openModal() {
        document.getElementById("imageModal").style.display = "block";
    }

    function closeModal() {
        document.getElementById("imageModal").style.display = "none";
    }
</script>

</body>
</html>
