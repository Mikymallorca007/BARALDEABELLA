<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAR ALDEA BELLA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: rgba(255, 255, 255, 0.9);
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
            position: relative;
        }
        header div {
            flex-grow: 1;
            text-align: center;
        }
        .go-home-button img {
            width: 50px;
            height: 50px;
        }

        /* Icono del cartel */
        .cartel-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            cursor: pointer;
        }

        /* Estilos del modal (cartel de helados) */
        .cartel-modal {
            display: none; /* Iniciado como oculto */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7); /* Fondo oscuro */
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .cartel-modal img {
            max-width: 80%;
            max-height: 80%;
            transition: transform 0.3s ease; /* Transición suave al hacer zoom */
            touch-action: none; /* Para permitir el gesto de pellizco */
        }

        /* Estilo para el botón de cierre */
        .close-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #E60012;
            color: white;
            border: none;
            font-size: 1.5em;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
        }

        /* Estilo para cuando el modal está activo */
        .cartel-modal.active {
            display: flex;
        }
    </style>
</head>
<body>

    <header>
        <a href="../index.html" class="go-home-button">
            <img src="../Imagenes/Iconos/Icono INICIO.jpg" alt="Volver al Inicio">
        </a>
        <div>"HELADOS"</div>
        <img src="../Helados/Icono Cartel Helados.png" alt="Ver Cartel" class="cartel-icon" onclick="openCartel()">
    </header>

    <!-- Modal para mostrar el cartel -->
    <div class="cartel-modal" id="cartelModal" onclick="closeCartel(event)">
        <button class="close-button" onclick="closeCartel(event)">X</button>
        <img src="../Helados/Cartel Helados.png" alt="Cartel Helados" id="cartelImage" />
    </div>

    <div class="carousel-container">
        <div class="carousel" id="carousel">
            <!-- Imágenes del carrusel -->
            <div class="carousel-item">
                <img src="../Helados/Fotos Helados/Calippo Cola.jpg" alt="Calippo Cola" onerror="this.onerror=null; this.src='../Helados/Fotos Helados/CalippoNo.jpg';">
                <h3>Calippo Cola</h3>
                <p>0,00 €</p>
            </div>
            <!-- ... (El resto de las imágenes del carrusel) ... -->
        </div>
    </div>

    <script>
        let currentIndex = 0;
        const items = document.querySelectorAll('.carousel-item');
        const totalItems = items.length;

        // Deslizar para cambiar imágenes (Táctil)
        let startX = 0;
        let endX = 0;
        let startY = 0;
        let endY = 0;

        const carousel = document.querySelector('.carousel');

        // Función para abrir el cartel (mostrar el modal)
        function openCartel() {
            document.getElementById('cartelModal').classList.add('active');
        }

        // Función para cerrar el cartel (modal)
        function closeCartel(event) {
            // Si se hace clic en el fondo (no en la imagen), cerrar el modal
            if (event.target === document.getElementById('cartelModal') || event.target === document.querySelector('.close-button')) {
                document.getElementById('cartelModal').classList.remove('active');
            }
        }

        // Deslizar y mover imágenes
        carousel.addEventListener('touchstart', function(e) {
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
        });

        carousel.addEventListener('touchmove', function(e) {
            endX = e.touches[0].clientX;
            endY = e.touches[0].clientY;
        });

        carousel.addEventListener('touchend', function() {
            if (startX > endX + 30) {
                if (currentIndex < totalItems - 1) {
                    currentIndex++;
                }
            } else if (startX < endX - 30) {
                if (currentIndex > 0) {
                    currentIndex--;
                }
            }

            // Si se desliza hacia arriba, reiniciar el carrusel
            if (startY < endY - 30) {
                currentIndex = 0;
            }

            updateCarousel();
        });

        // Actualizar el carrusel
        function updateCarousel() {
            // Eliminar la transición si estamos en el primer o último elemento
            if (currentIndex === 0 || currentIndex === totalItems - 1) {
                carousel.style.transition = 'none';
            } else {
                carousel.style.transition = 'transform 0.5s ease-in-out';
            }

            const newTransformValue = -currentIndex * 100;
            carousel.style.transform = `translateX(${newTransformValue}%)`;
        }

        // Variables para el zoom táctil
        let initialDistance = null;
        let initialScale = 1;

        const modalImage = document.getElementById('cartelImage');

        modalImage.addEventListener('touchstart', function(event) {
            if (event.touches.length === 2) { // Si hay dos toques (gesto de pellizco)
                initialDistance = getDistance(event.touches[0], event.touches[1]);
                initialScale = modalImage.style.transform ? parseFloat(modalImage.style.transform.replace('scale(', '').replace(')', '')) : 1;
            }
        });

        modalImage.addEventListener('touchmove', function(event) {
            if (event.touches.length === 2 && initialDistance !== null) {
                let currentDistance = getDistance(event.touches[0], event.touches[1]);
                let scaleFactor = currentDistance / initialDistance;
                let newScale = initialScale * scaleFactor;

                modalImage.style.transform = `scale(${newScale})`;
            }
        });

        modalImage.addEventListener('touchend', function(event) {
            if (event.touches.length < 2) {
                initialDistance = null; // Restablecer cuando se termina el gesto
            }
        });

        // Función para obtener la distancia entre dos puntos táctiles
        function getDistance(touch1, touch2) {
            const dx = touch2.clientX - touch1.clientX;
            const dy = touch2.clientY - touch1.clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }
    </script>

</body>
</html>
