<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comida</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .back-button {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
        .back-button img {
            width: 50px;
            height: 50px;
            cursor: pointer;
        }
        .cart-container {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
        .cart-icon {
            width: 50px;
            height: 50px;
            cursor: pointer;
        }
        .section {
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .row {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .category {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 45%;
        }
        .category img {
            width: 100%;
            max-width: 250px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
            margin-top: -30px; /* Ajusta este valor para mover la imagen hacia arriba */
        }
        .category img:hover {
            transform: scale(1.1);
        }
        .category a {
            text-decoration: none;
            color: black;
            font-size: 1.2em;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        footer {
            background-color: #E60012;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-button">
            <img src="Imagenes/Icono INICIO.jpg" alt="Volver al Inicio">
        </a>
        Comida
        <div class="cart-container">
            <a href="Carrito.html">
                <img src="Imagenes/Carrito.png" alt="Ver Carrito" class="cart-icon">
            </a>
        </div>
    </header>

    <!-- Botón para volver atrás -->
    <div class="back-button-container" style="text-align: center; padding: 10px;">
        <a href="javascript:history.back()">
            <img src="Imagenes/Icono Regresar.png" alt="Volver atrás" style="width: 40px; height: 40px; cursor: pointer;">
        </a>
    </div>

    <div class="section">
        <div class="row">
            <div class="category">
                <a href="Hamburguesas y Perritos Calientes.html">
                    <img src="Imagenes/Comidas/Icono Hamburguesas y Perritos.jpeg" alt="Hamburguesas / Perrito Caliente">
                </a>
                <a href="Hamburguesas y Perritos Calientes.html">Hamburguesas / Perritos Calientes</a>
            </div>
            <div class="category">
                <a href="bocadillos.html">
                    <img src="Imagenes/Comidas/Icono Bocadillos.jpeg" alt="Bocadillos">
                </a>
                <a href="bocadillos.html">Bocadillos</a>
            </div>
        </div>
        <div class="row">
            <div class="category">
                <a href="Comidas/Sandwiches/Indexsandwiches.html">
                    <img src="Imagenes/Comidas/Icono Sandwiches.jpeg" alt="Sandwiches">
                </a>
                <a href="Sandwiches/sandwiches.html">Sandwiches</a>
            </div>
            <div class="category">
                <a href="pizzas.html">
                    <img src="Imagenes/Comidas/Icono Pizzas.jpeg" alt="Pizzas">
                </a>
                <a href="pizzas.html">Pizzas</a>
            </div>
        </div>
        <div class="row">
            <div class="category">
                <a href="raciones.html">
                    <img src="Imagenes/Comidas/Icono Raciones.jpeg" alt="Raciones">
                </a>
                <a href="raciones.html">Raciones</a>
            </div>
            <div class="category">
                <a href="desayunos.html">
                    <img src="Imagenes/Comidas/Icono Desayunos.jpeg" alt="Desayunos">
                </a>
                <a href="desayunos.html">Desayunos</a>
            </div>
        </div>
        <div class="row">
            <div class="category">
                <a href="platoscombinados.html">
                    <img src="Imagenes/Comidas/Icono Platos Combinados.jpeg" alt="Platos Combinados">
                </a>
                <a href="platoscombinados.html">Platos Combinados</a>
            </div>
            <div class="category">
                <a href="rolls.html">
                    <img src="Imagenes/Comidas/Icono Rolls.jpeg" alt="Rolls">
                </a>
                <a href="rolls.html">Rolls</a>
            </div>
        </div>
    </div>

    <footer>&copy; 2025 Bar Aldea Bella | Todos los derechos reservados</footer>
</body>
</html>
