<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburguesa<br>Ternera</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center; /* Centra el texto en el header */
        }
        .header-left {
            position: absolute;
            left: 20px; /* Coloca el icono a la izquierda */
            display: flex;
            align-items: center; /* Centra verticalmente el icono */
        }
        .header-left img {
            width: 40px;
            height: auto;
            margin-right: 10px;
        }
        .content-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 30px;
        }
        .image-container {
            flex: 1;
            text-align: center;
        }
        .image-container img {
            width: 150px;
            height: auto;
            border-radius: 10px;
        }
        .extras-container {
            flex: 1;
            background: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            max-width: 300px;
        }
        .extras-container h2 {
            text-align: center;
        }
        .extras-container label {
            display: block;
            margin: 5px 0;
            font-size: 1.1em;
        }
        .back-button {
            display: block;
            margin: 20px auto;
            width: 60px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.2em;
        }
        button:hover {
            background-color: #45a049;
        }

        /* Estilo del mensaje de confirmación */
        #confirmation-message {
            display: none;
            color: green;
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 20px;
            background-color: rgba(0, 255, 0, 0.2);
            padding: 10px;
            border-radius: 10px;
            animation: mostrarMensaje 1s ease-out;
        }

        /* Animación para el mensaje de confirmación */
        @keyframes mostrarMensaje {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Imagen "Enviando al carrito" que ocupa toda la pantalla */
        #sending-image {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover; /* Hace que la imagen cubra todo el fondo */
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.7); /* Agrega un fondo semitransparente */
        }

        /* Animación para el icono del carrito */
        .cart-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .cart-icon.added {
            transform: scale(1.1); /* Aumenta el tamaño del icono */
            animation: iconAnim 0.5s ease-out;
        }

        @keyframes iconAnim {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }

        /* Estilo para el botón */
        button:active {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <!-- Icono Volver a Inicio centrado verticalmente -->
            <a href="index.html">
                <img src="Imagenes/Icono INICIO.jpg" alt="Volver" class="back-button">
            </a>
        </div>
        <div>
            Hamburguesa<br>Ternera
        </div>
    </header>
    
    <!-- Botón Regresar atrás -->
    <a href="javascript:history.back()">
        <img src="Imagenes/Icono Regresar.png" alt="Regresar atrás" class="back-button">
    </a>
    
    <div class="content-container">
        <div class="image-container">
            <img src="Imagenes/Comidas/Hamburguesa Ternera.jpg" alt="Hamburguesa Ternera">
        </div>
        <div class="extras-container">
            <h2>Elige tus ingredientes extra:</h2>
            <label><input type="checkbox" id="extra1"> Patatas - 1,00€</label>
            <label><input type="checkbox" id="extra2"> Bacon - 1,00€</label>
            <label><input type="checkbox" id="extra3"> Huevo - 1,00€</label>
            <label><input type="checkbox" id="extra4"> Queso - 0,20€</label>
            <label><input type="checkbox" id="extra5"> Tomate - 0,20€</label>
            <label><input type="checkbox" id="extra6"> Cebolla - 0,20€</label>
            <label><input type="checkbox" id="extra7"> Lechuga - 0,20€</label>
            
            <!-- Botón para agregar al Carrito -->
            <button onclick="agregarAlCarrito()">Agregar al Carrito</button>

            <!-- Mensaje de confirmación -->
            <div id="confirmation-message">Producto agregado al Carrito.</div>
        </div>
    </div>

    <!-- Imagen de "Enviando al carrito" -->
    <img id="sending-image" src="Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito">

    <!-- Icono del Carrito -->
    <a href="Carrito.html">
        <img src="Imagenes/Carrito.png" alt="Ver Carrito" class="cart-icon">
    </a>

    <script>
        let Carrito = JSON.parse(localStorage.getItem('Carrito')) || []; // Leer Carrito desde almacenamiento local

        // Función para deseleccionar los extras
        function deseleccionarExtras() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
        }

        // Llamar a la función cuando se cargue la página
        window.onload = function() {
            deseleccionarExtras(); // Desmarcar los extras al cargar la página
        };

        // Función para agregar al Carrito
        function agregarAlCarrito() {
            const producto = "Hamburguesa de Ternera";
            const precioBase = 5.80;

            let extras = [];
            let precioExtras = 0;

            if (document.getElementById("extra1").checked) {
                extras.push("Patatas");
                precioExtras += 1.00;
            }
            if (document.getElementById("extra2").checked) {
                extras.push("Bacon");
                precioExtras += 1.00;
            }
            if (document.getElementById("extra3").checked) {
                extras.push("Huevo");
                precioExtras += 1.00;
            }
            if (document.getElementById("extra4").checked) {
                extras.push("Queso");
                precioExtras += 0.20;
            }
            if (document.getElementById("extra5").checked) {
                extras.push("Tomate");
                precioExtras += 0.20;
            }
            if (document.getElementById("extra6").checked) {
                extras.push("Cebolla");
                precioExtras += 0.20;
            }
            if (document.getElementById("extra7").checked) {
                extras.push("Lechuga");
                precioExtras += 0.20;
            }

            let precioTotal = precioBase + precioExtras;

            let item = {
                nombre: producto,
                extras: extras,
                precioBase: precioBase,
                precioTotal: precioTotal
            };

            // Agregar el producto al carrito
            Carrito.push(item);
            localStorage.setItem('Carrito', JSON.stringify(Carrito)); // Guardar Carrito en almacenamiento local

            // Mostrar el mensaje de confirmación
            let message = document.getElementById("confirmation-message");
            message.style.display = "block";

            // Ocultar el mensaje después de 3 segundos
            setTimeout(function() {
                message.style.display = "none";
            }, 3000);

            // Mostrar la imagen "Enviando a carrito" durante 3 segundos
            let sendingImage = document.getElementById("sending-image");
            sendingImage.style.display = "block";

            setTimeout(function() {
                sendingImage.style.display = "none";
            }, 3000);

            // Cambiar visualmente el carrito
            let cartIcon = document.querySelector(".cart-icon");
            cartIcon.classList.add("added");

            // Restablecer el icono del carrito después de 1 segundo
            setTimeout(function() {
                cartIcon.classList.remove("added");
            }, 1000);

            // Deseleccionar los extras después de agregar al Carrito
            deseleccionarExtras();
        }
    </script>
</body>
</html>
