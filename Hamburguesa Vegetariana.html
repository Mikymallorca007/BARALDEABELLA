<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburguesa<br>vegetariana</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .header-left {
            position: absolute;
            left: -10px;
            display: flex;
            align-items: center;
        }
        .header-left img {
            width: 40px;
            height: auto;
            margin-right: 5px;
            position: relative;
            top: -5px;
        }
        .content-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 30px;
        }
        .image-container {
            flex: 1;
            text-align: center;
            margin-top: 20px;
        }
        .image-container img {
            width: 150px;
            height: auto;
            border-radius: 10px;
            margin-top: -40px;
        }
        .extras-container {
            flex: 1;
            background: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            max-width: 300px;
        }
        .extras-container h2 {
            text-align: center;
        }
        .extras-container label {
            display: block;
            margin: 5px 0;
            font-size: 1.1em;
        }
        .back-button {
            display: block;
            margin: 10px;
            transition: transform 0.3s ease;
        }
        .cart-icon.added {
            transform: scale(1.1);
            animation: iconAnim 0.5s ease-out;
        }
        @keyframes iconAnim {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        button:active {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="index.html">
                <img src="Imagenes/Icono INICIO.jpg" alt="Volver" class="back-button">
            </a>
        </div>
        <div>
            Hamburguesa<br>De vegetariana
        </div>
    </header>

    <a href="javascript:history.back()">
        <img src="Imagenes/Icono Regresar.png" alt="Regresar atrás" class="back-button">
    </a>

    <div class="content-container">
        <div class="image-container">
            <img src="Imagenes/Comidas/Hamburguesa vegetariana.jpg" alt="Hamburguesa vegetariana">
        </div>
        <div class="extras-container">
            <h2>Elige tus ingredientes extra:</h2>
            <label><input type="checkbox" id="extra1"> Patatas - 1,00€</label>
            <label><input type="checkbox" id="extra2"> Bacon - 1,00€</label>
            <label><input type="checkbox" id="extra3"> Huevo - 1,00€</label>
            <label><input type="checkbox" id="extra4"> Queso - 0,20€</label>
            <label><input type="checkbox" id="extra5"> Tomate - 0,20€</label>
            <label><input type="checkbox" id="extra6"> Cebolla - 0,20€</label>
            <label><input type="checkbox" id="extra7"> Lechuga - 0,20€</label>
            
            <button onclick="agregarAlCarrito()">Agregar al Carrito</button>

            <div id="confirmation-message">Producto agregado al Carrito.</div>
        </div>
    </div>

    <img id="sending-image" src="Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito">

    <a href="Carrito.html">
        <img src="Imagenes/Carrito.png" alt="Ver Carrito" class="cart-icon">
    </a>

    <script>
        let Carrito = JSON.parse(localStorage.getItem('Carrito')) || [];

        function deseleccionarExtras() {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]');
            checkboxes.forEach(checkbox => {
                checkbox.checked = false;
            });
        }

        window.onload = function() {
            deseleccionarExtras();
        };

        function agregarAlCarrito() {
            const producto = "Hamburguesa de vegetariana";
            const precioBase = 5.80;

            let extras = [];
            let precioExtras = 0;

            if (document.getElementById("extra1").checked) {
                extras.push("Patatas");
                precioExtras += 1.00;
            }
            if (document.getElementById("extra2").checked) {
                extras.push("Bacon");
                precioExtras += 1.00;
            }
            if (document.getElementById("extra3").checked) {
                extras.push("Huevo");
                precioExtras += 1.00;
            }
            if (document.getElementById("extra4").checked) {
                extras.push("Queso");
                precioExtras += 0.20;
            }
            if (document.getElementById("extra5").checked) {
                extras.push("Tomate");
                precioExtras += 0.20;
            }
            if (document.getElementById("extra6").checked) {
                extras.push("Cebolla");
                precioExtras += 0.20;
            }
            if (document.getElementById("extra7").checked) {
                extras.push("Lechuga");
                precioExtras += 0.20;
            }

            let precioTotal = precioBase + precioExtras;

            let item = {
                nombre: producto,
                extras: extras,
                precioBase: precioBase,
                precioTotal: precioTotal
            };

            Carrito.push(item);
            localStorage.setItem('Carrito', JSON.stringify(Carrito));

            // Mostrar mensaje de confirmación
            let message = document.getElementById("confirmation-message");
            message.style.display = "block";
            setTimeout(() => { message.style.display = "none"; }, 3000);

            // Llamar a la función para mostrar la imagen "Enviando a carrito"
            mostrarImagenEnvio();

            // Llamar a la función para deseleccionar los extras
            deseleccionarExtras();
        }

        function mostrarImagenEnvio() {
            let sendingImage = document.getElementById("sending-image");
            sendingImage.style.display = "block"; // Mostrar la imagen
            setTimeout(() => { 
                sendingImage.style.display = "none"; // Ocultar la imagen después de 1 segundos
            }, 1000);
        }
    </script>
</body>
</html>
