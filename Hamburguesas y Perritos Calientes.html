<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hamburguesas y Perritos Calientes</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            display: flex;
            flex-direction: column;
            min-height: 100vh; /* Esto asegura que el contenido ocupe toda la altura de la pantalla */
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 5px;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            text-align: center; /* Asegura que todo el contenido en el header esté centrado */
        }
        .go-home-button {
            position: absolute;
            left: 20px; /* Lo desplaza a la izquierda */
            top: 50%;
            transform: translateY(-50%);
        }
        .go-home-button img {
            width: 50px;
            height: 50px;
            cursor: pointer;
        }
        .cart-container {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
        }
        .cart-icon {
            width: 50px;
            height: 50px;
            cursor: pointer;
        }
        .back-button-container {
            display: flex;
            justify-content: center;
            padding: 10px;
            background-color: #E60012;
        }
        .back-button img {
            width: 40px; /* Ajusté el tamaño del botón */
            height: 40px;
            cursor: pointer;
        }
        .section {
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1; /* Esto hace que la sección principal ocupe el espacio disponible */
        }
        .row {
            display: flex;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .category {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 45%;
        }
        .category img {
            width: 100%;
            max-width: 250px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .category img:hover {
            transform: scale(1.1);
        }
        .category a {
            text-decoration: none;
            color: black;
            font-size: 1.2em;
            font-weight: bold;
            display: block;
            margin-top: 10px;
        }
        footer {
            background-color: #E60012;
            color: white;
            text-align: center;
            padding: 10px;
            margin-top: auto; /* Esto empuja el pie de página al fondo */
        }
    </style>
</head>
<body>
    <header>
        <!-- Botón para Volver al Inicio (Ahora a la izquierda) -->
        <a href="index.html" class="go-home-button">
            <img src="Imagenes/Icono INICIO.jpg" alt="Volver al Inicio">
        </a>
      
        <div>
            Hamburguesas<br>Perritos Calientes
        </div>
       
        <div class="cart-container">
            <a href="Carrito.html">
                <img src="Imagenes/Carrito.png" alt="Ver Carrito" class="cart-icon">
            </a>
        </div>
    </header>

    <!-- Botón para Volver atrás centrado debajo del header con tamaño más pequeño -->
    <div class="back-button-container">
        <a href="javascript:history.back()" class="back-button">
            <img src="Imagenes/Icono Regresar.png" alt="Volver atrás">
        </a>
    </div>

    <div class="section">
        <div class="row">
            <div class="category">
                <a href="Hamburguesas.html">
                    <img src="Imagenes/Comidas/Icono Hamburguesas y Perritos.jpeg" alt="Hamburguesas / Perrito Caliente">
                </a>
                <a href="Hamburguesas.html">Hamburguesas</a>
            </div>
            <div class="category">
                <a href="Perritos Calientes.html">
                    <img src="Imagenes/Comidas/Tipos Perritos.jpg" alt="Perritos Calientes">
                </a>
                <a href="Perritos Calientes.html">Perritos Calientes</a>
            </div>
        </div>
    </div>

    <footer>&copy; 2025 Bar Aldea Bella | Todos los derechos reservados</footer>
</body>
</html>
