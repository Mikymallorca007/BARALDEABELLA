<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAR ALDEA BELLA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .header-left {
            position: absolute;
            left: -10px;
            display: flex;
            align-items: center;
        }
        .header-left img {
            width: 40px;
            height: auto;
            margin-right: 5px;
            position: relative;
            top: -5px;
        }
        .content-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 30px;
        }
        .image-container {
            flex: 1;
            text-align: center;
            margin-top: 20px;
        }
        .image-container img {
            width: 150px;
            height: auto;
            border-radius: 10px;
            margin-top: -40px;
        }
        .extras-container {
            flex: 1;
            background: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            max-width: 300px;
        }
        .extras-container h2 {
            text-align: center;
        }
        .extras-container label {
            display: block;
            margin: 5px 0;
            font-size: 1.1em;
        }
        .back-button {
            width: 40px;
            height: auto;
            position: absolute;
            top: 150px;
            left: 20px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.2em;
        }
        button:hover {
            background-color: #45a049;
        }
        #sending-image {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.7);
        }
        .cart-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        #precioTotal {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="../../index.html">
            <img src="../../Imagenes/Iconos/Icono INICIO.jpg" alt="Volver" class="back-button">
        </a>
    </div>
    <div>
        BOCADILLO<br>Atún
        </div>
    </header>

    <a href="javascript:history.back()">
        <img src="../../Imagenes/Iconos/Icono Regresar.png" alt="Regresar atrás" class="back-button">
    </a>


<div class="content-container">
    <div class="image-container">
        <img src="../Bocadillos/Bocadillo Atun.jpg" alt="Bocadillo de Atún">
    </div>
    <div class="extras-container">
        <h2>Extras</h2>
        <label><input type="checkbox" id="queso"> Queso</label>
        <label><input type="checkbox" id="cebolla"> Cebolla</label>
        <label><input type="checkbox" id="Tomate"> Tomate</label>
        <label><input type="checkbox" id="Mayonesa"> Mayonesa</label>

        <button onclick="agregarAlCarrito()">Añadir al carrito</button>
        <div id="precioTotal">0.00 €</div>
    </div>
</div>

    <img id="sending-image" src="../../Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito">

    <a href="../../Carrito.html">
        <img src="../../Imagenes/Iconos/Carrito.png" alt="Ver Carrito" class="cart-icon">
    </a>


<script>
    const PRECIO_BASE = 6.00; // Precio base del bocadillo
const combinacionesPrecios = {
    "Queso": 0.40,
    "Cebolla": 0.40,
    "Tomate": 0.40,
    "Mayonesa": 0.00,

    "Queso,Cebolla": 0.80,
    "Queso,Tomate": 0.80,
    "Queso,Mayonesa": 0.40,
    "Cebolla,Tomate": 0.80,
    "Cebolla,Mayonesa": 0.40,
    "Tomate,Mayonesa": 0.40,

    "Queso,Cebolla,Tomate": 1.20,
    "Queso,Cebolla,Mayonesa": 0.80,
    "Queso,Tomate,Mayonesa": 0.80,
    "Cebolla,Tomate,Mayonesa": 0.80,

    "Queso,Cebolla,Tomate,Mayonesa": 1.20
};

    function calcularPrecio() {
        const opcion1 = document.getElementById("queso").checked ? "Queso" : "";
        const opcion2 = document.getElementById("cebolla").checked ? "Cebolla" : "";
        const opcion3 = document.getElementById("Tomate").checked ? "Tomate" : "";
        const opcion4 = document.getElementById("Mayonesa").checked ? "Mayonesa" : "";

        const seleccionados = [opcion1, opcion2, opcion3, opcion4].filter(item => item).join(",");

        let precioExtras = combinacionesPrecios[seleccionados] !== undefined ? combinacionesPrecios[seleccionados] : 0;
        let precioTotal = PRECIO_BASE + precioExtras;

        document.getElementById("precioTotal").textContent = precioTotal.toFixed(2) + " €";
    }

    document.querySelectorAll("input[type=checkbox]").forEach(checkbox => {
        checkbox.addEventListener('change', calcularPrecio);
    });

    function agregarAlCarrito() {
        const precioTotal = document.getElementById("precioTotal").textContent;
        const precioNumerico = parseFloat(precioTotal.replace(" €", ""));

        if (isNaN(precioNumerico)) {
            alert("Error al obtener el precio.");
            return;
        }

        const ingredientesSeleccionados = [];
        document.querySelectorAll("input[type=checkbox]:checked").forEach(checkbox => {
            ingredientesSeleccionados.push(checkbox.id.charAt(0).toUpperCase() + checkbox.id.slice(1)); 
        });

        let producto = {
            nombre: "Bocadillo Atún",
            extras: ingredientesSeleccionados.length > 0 ? ingredientesSeleccionados : [""],
            precioBase: PRECIO_BASE,
            precioTotal: precioNumerico
        };

        let carrito = JSON.parse(localStorage.getItem('Carrito')) || [];
        carrito.push(producto);
        localStorage.setItem('Carrito', JSON.stringify(carrito));

        console.log("Carrito después de agregar:", carrito);

        mostrarImagenEnvio();
    }

    function mostrarImagenEnvio() {
        let sendingImage = document.getElementById("sending-image");
        sendingImage.style.display = "block";
        setTimeout(() => { 
            sendingImage.style.display = "none"; 
        }, 1000);
    }

    window.onload = function() {
        document.querySelectorAll("input[type=checkbox]").forEach(checkbox => {
            checkbox.checked = false;
        });
        calcularPrecio();
    };
</script>

</body>
</html>
