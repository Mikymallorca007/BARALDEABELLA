<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandwich<br>Solo York</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .header-left {
            position: absolute;
            left: -10px;
            display: flex;
            align-items: center;
        }
        .header-left img {
            width: 40px;
            height: auto;
            margin-right: 5px;
            position: relative;
            top: -5px;
        }
        .content-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 30px;
        }
        .image-container {
            flex: 1;
            text-align: center;
            margin-top: 20px;
        }
        .image-container img {
            width: 150px;
            height: auto;
            border-radius: 10px;
            margin-top: -40px;
        }
        .extras-container {
            flex: 1;
            background: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            max-width: 300px;
        }
        .back-button {
            display: block;
            margin: 10px;
            width: 50px;
            position: absolute;
            left: 20px;
            top: 120px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.2em;
        }
        button:hover {
            background-color: #45a049;
        }
        #sending-image {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.7);
        }
        .cart-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="../../index.html">
                <img src="../../Imagenes/Icono INICIO.jpg" alt="Volver" class="back-button">
            </a>
        </div>
        <div>
            Sandwich<br>solo York
        </div>
    </header>

    <a href="javascript:history.back()">
        <img src="../../Imagenes/Icono Regresar.png" alt="Regresar atrás" class="back-button">
    </a>

    <div class="content-container">
        <div class="image-container">
            <img src="Imagenes Sandwiches/Sandwich Solo York.jpg" alt="Sandwich solo York">
        </div>
        <div class="extras-container">
            <p>Solo York.</p>
            <button onclick="agregarAlCarrito()">Agregar al Carrito</button>
        </div>
    </div>

    <img id="sending-image" src="../../Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito">

    <a href="../../Carrito.html">
        <img src="../../Imagenes/Carrito.png" alt="Ver Carrito" class="cart-icon">
    </a>

    <script>
        let Carrito = JSON.parse(localStorage.getItem('Carrito')) || [];

        function agregarAlCarrito() {
            const producto = "Sandwich solo York";
            const precioBase = 2.00;
            
            let item = {
                nombre: producto,
                precioBase: precioBase,
                precioTotal: precioBase
            };

            Carrito.push(item);
            localStorage.setItem('Carrito', JSON.stringify(Carrito));
            
            mostrarImagenEnvio();
        }

        function mostrarImagenEnvio() {
            let sendingImage = document.getElementById("sending-image");
            sendingImage.style.display = "block";
            setTimeout(() => { 
                sendingImage.style.display = "none";
            }, 1000);
        }
    </script>
</body>
</html>
