<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandwich o Tostada</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .back-button {
            position: absolute;
            top: 150px;
            left: 20px;
            width: 40px;
        }
        .cart-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            cursor: pointer;
        }
        #precioTotal {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 10px;
        }
        button {
            padding: 10px 20px;
            background-color: #E60012;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1.2em;
            margin-top: 10px;
        }
        button:hover {
            background-color: #b7000e;
        }
        #sending-image {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.7);
        }
    </style>
</head>
<body>
    <header>
        <a href="../../index.html">
            <img src="../../Imagenes/Icono INICIO.jpg" alt="Volver" class="back-button">
        </a>
        <div>Sandwich o Tostada</div>
    </header>

    <a href="javascript:history.back()">
        <img src="../../Imagenes/Icono Regresar.png" alt="Regresar atrás" class="back-button">
    </a>

    <div class="content-container">
        <div class="image-container">
            <img src="Imagenes Sandwiches/Sandwich eleccion.jpg" alt="Sandwich York & Queso">
        </div>
    </div>

    <img id="sending-image" src="../../Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito">

    <a href="../../Carrito.html">
        <img src="../../Imagenes/Carrito.png" alt="Ver Carrito" class="cart-icon">
    </a>

    <script>
        function agregarAlCarrito() {
            let precioTotal = "2.00"; // Valor de ejemplo, modificar según lógica real
            let carrito = JSON.parse(localStorage.getItem('Carrito')) || [];
            
            let producto = {
                nombre: "Sandwich/Tostada",
                precioTotal: parseFloat(precioTotal)
            };
            
            carrito.push(producto);
            localStorage.setItem('Carrito', JSON.stringify(carrito));
            
            mostrarImagenEnvio();
        }

        function mostrarImagenEnvio() {
            let sendingImage = document.getElementById("sending-image");
            sendingImage.style.display = "block";
            setTimeout(() => {
                sendingImage.style.display = "none";
            }, 1000);
        }
    </script>
</body>
</html>
