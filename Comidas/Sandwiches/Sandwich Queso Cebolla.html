<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanwich<br>Queso Cebolla</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .header-left {
            position: absolute;
            left: -10px;
            display: flex;
            align-items: center;
        }
        .header-left img {
            width: 40px;
            height: auto;
            margin-right: 5px;
            position: relative;
            top: -5px;
        }
        .content-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            padding: 20px;
        }
        .image-container {
            margin-top: 0; /* Mueve la imagen más arriba */
        }
        .image-container img {
            width: 150px;
            height: auto;
            border-radius: 10px;
            display: block; /* Asegura que la imagen se comporte como un bloque */
            margin-left: auto; /* Centra la imagen horizontalmente */
            margin-right: auto; /* Centra la imagen horizontalmente */
        }
        .extras-container {
            background: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            max-width: 300px;
            margin-top: 20px; /* Añade un margen superior para separar los extras de la imagen */
        }
        .extras-container label {
            display: block;
            margin: 5px 0;
            font-size: 1.1em;
        }
        .back-button {
            display: block;
            margin: 10px;
            width: 50px;
            position: absolute;
            left: 20px;
            top: 120px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.2em;
        }
        button:hover {
            background-color: #45a049;
        }
        #confirmation-message {
            display: none;
            color: green;
            font-size: 1.3em;
            font-weight: bold;
            margin-top: 20px;
            background-color: rgba(0, 255, 0, 0.2);
            padding: 10px;
            border-radius: 10px;
            animation: mostrarMensaje 1s ease-out;
        }
        @keyframes mostrarMensaje {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        #sending-image {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.7);
        }
        .cart-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .cart-icon.added {
            transform: scale(1.1);
            animation: iconAnim 0.5s ease-out;
        }
        @keyframes iconAnim {
            0% { transform: scale(1); }
            100% { transform: scale(1.1); }
        }
        button:active {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="../../index.html">
                <img src="../../Imagenes/Icono INICIO.jpg" alt="Volver" class="back-button">
            </a>
        </div>
        <div>
            Sandwich<br>Queso Cebolla
        </div>
    </header>

    <a href="javascript:history.back()">
        <img src="../../Imagenes/Icono Regresar.png" alt="Regresar atrás" class="back-button">
    </a>

    <div class="content-container">
        <div class="image-container">
            <img src="Imagenes Sandwiches/Sandwich Queso Cebolla.jpg.jpg" alt="Sandwich Queso y Cebolla">
        </div>
        <div class="extras-container">
            <label>Ingredientes: Queso y cebolla.</label>
            
           <div class="button-container" style="display: flex; justify-content: center; margin-top: 20px;">
    <button onclick="agregarAlCarrito()">Agregar al Carrito</button>
</div>



            <div id="confirmation-message">Producto agregado al Carrito.</div>
        </div>
    </div>

    <img id="sending-image" src="../../Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito">

    <a href="../../Carrito.html">
        <img src="../../Imagenes/Carrito.png" alt="Ver Carrito" class="cart-icon">
    </a>

    <script>
        let Carrito = JSON.parse(localStorage.getItem('Carrito')) || [];

        window.onload = function() {
            // No es necesario deseleccionar extras ya que ya no los estamos manejando.
        };

        function agregarAlCarrito() {
            const producto = "Sandwich Completo";
            const precioBase = 2.4;

            // Ingredientes fijos para el sandwich
            let extras = ["Queso y Cebolla"]; 
            let precioExtras = 0; // No hay precio adicional por extras, se mantiene en 0

            let precioTotal = precioBase + precioExtras;

            let item = {
                nombre: producto,
                extras: extras,
                precioBase: precioBase,
                precioTotal: precioTotal
            };

            Carrito.push(item);
            localStorage.setItem('Carrito', JSON.stringify(Carrito));

            // Mostrar mensaje de confirmación
            let message = document.getElementById("confirmation-message");
            message.style.display = "block";
            setTimeout(() => { message.style.display = "none"; }, 3000);

            // Llamar a la función para mostrar la imagen "Enviando a carrito"
            mostrarImagenEnvio();
        }

        function mostrarImagenEnvio() {
            let sendingImage = document.getElementById("sending-image");
            sendingImage.style.display = "block"; // Mostrar la imagen
            setTimeout(() => { 
                sendingImage.style.display = "none"; // Ocultar la imagen después de 3 segundos
            }, 3000);
        }
    </script>
</body>
</html>
