<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perrito Caliente</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      text-align: center;
    }
    header {
      background-color: #E60012;
      color: white;
      padding: 20px;
      font-size: 2em;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .header-left, .back-button-header {
      position: absolute;
      top: 20px;
    }
    .header-left {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .header-left img {
      width: 40px;
      height: auto;
    }
    .back-button-header {
      right: 20px;
    }
    .back-button-header img {
      width: 40px;
      height: auto;
    }
    .content-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      padding: 30px;
    }
    .image-container img {
      width: 150px;
      height: auto;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .extras-container {
      background: #f8f8f8;
      padding: 20px;
      border-radius: 10px;
      max-width: 300px;
      text-align: left;
    }
    .extras-container h2 {
      text-align: center;
    }
    .extras-container label {
      display: block;
      margin: 5px 0;
      font-size: 1.1em;
    }
    .btn-agregar {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 1.2em;
      margin-top: 15px;
    }
    .btn-agregar:hover {
      background-color: #45a049;
    }
    #precioTotal {
      font-size: 1.5em;
      font-weight: bold;
      margin-top: 10px;
    }
    #confirmation-message {
      display: none;
      color: green;
      font-size: 1.3em;
      font-weight: bold;
      margin-top: 20px;
      background-color: rgba(0, 255, 0, 0.2);
      padding: 10px;
      border-radius: 10px;
      animation: mostrarMensaje 1s ease-out;
    }
    @keyframes mostrarMensaje {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    #sending-image {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a href="../../index.html">
        <img src="../../Imagenes/Iconos/Icono INICIO.jpg" alt="Inicio" />
      </a>
    </div>
    <div>Perrito Caliente<br>Hot Dog</div>
    <div class="back-button-header">
      <a href="javascript:history.back()">
        <img src="../../Imagenes/Iconos/Icono Regresar.png" alt="Volver atrás" />
      </a>
    </div>
  </header>

  <div class="content-container">
    <div class="image-container">
      <img src="../../Comidas/Perrito/Perrito Caliente.jpg" alt="Perrito Caliente" />
    </div>
    <div class="extras-container">
      <h2>Elige tus ingredientes extra:</h2>
      <label><input type="checkbox" id="extra1" /> Patatas - 1,00€</label>
      <label><input type="checkbox" id="extra2" /> Cebolla - 0,20€</label>

      <div id="precioTotal">4.00€</div>
      <button class="btn-agregar" onclick="agregarAlCarrito()">Agregar al Carrito</button>
      <div id="confirmation-message">Producto agregado al Carrito.</div>
    </div>
  </div>

  <img id="sending-image" src="../../Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito" />

  <script>
    const PRECIO_BASE = 4.00;

    function calcularPrecio() {
      let precioExtras = 0;
      document.querySelectorAll("input[type=checkbox]").forEach(checkbox => {
        if (checkbox.checked) {
          const texto = checkbox.parentElement.textContent;
          const precioTexto = texto.match(/([\d,]+)€/);
          if (precioTexto) {
            precioExtras += parseFloat(precioTexto[1].replace(',', '.'));
          }
        }
      });
      const precioTotal = PRECIO_BASE + precioExtras;
      document.getElementById("precioTotal").textContent = precioTotal.toFixed(2) + " €";
    }

    function agregarAlCarrito() {
      const extras = [];
      let precioExtras = 0;
      document.querySelectorAll("input[type=checkbox]").forEach(checkbox => {
        if (checkbox.checked) {
          extras.push(checkbox.parentElement.textContent.split(" - ")[0].trim());
          const precioTexto = checkbox.parentElement.textContent.match(/([\d,]+)€/);
          if (precioTexto) {
            precioExtras += parseFloat(precioTexto[1].replace(',', '.'));
          }
        }
      });
      const precioTotal = PRECIO_BASE + precioExtras;
      const item = {
        nombre: "Perrito Caliente",
        extras: extras,
        precioBase: PRECIO_BASE,
        precioTotal: precioTotal
      };
      const Carrito = JSON.parse(localStorage.getItem('Carrito')) || [];
      Carrito.push(item);
      localStorage.setItem('Carrito', JSON.stringify(Carrito));

      mostrarConfirmacion();
      deseleccionarExtras();
      calcularPrecio();
    }

    function mostrarConfirmacion() {
      document.getElementById("confirmation-message").style.display = "block";
      document.getElementById("sending-image").style.display = "block";
      setTimeout(() => {
        document.getElementById("confirmation-message").style.display = "none";
        document.getElementById("sending-image").style.display = "none";
      }, 1200);
    }

    function deseleccionarExtras() {
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
    }

    window.onload = function() {
      deseleccionarExtras();
      calcularPrecio();
    };
  </script>
</body>
</html>
