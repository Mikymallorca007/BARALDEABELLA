<!-- Versión corregida: el botón de INICIO está ahora perfectamente centrado verticalmente dentro del header -->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAR ALDEA BELLA</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      text-align: center;
    }
    header {
      background-color: #E60012;
      color: white;
      padding: 20px;
      font-size: 2em;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .header-left {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .header-left img {
      width: 40px;
      height: auto;
    }
    .back-button {
      width: 40px;
      height: auto;
      position: absolute;
      top: 150px;
      left: 20px;
    }
    .cart-icon {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 50px;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    .content-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      padding: 30px;
    }
    .image-container {
      flex: 1;
      text-align: center;
      margin-top: 20px;
    }
    .image-container img {
      width: 150px;
      height: auto;
      border-radius: 10px;
      margin-top: -40px;
    }
    .extras-container {
      flex: 1;
      background: #f8f8f8;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
      max-width: 300px;
    }
    .extras-container h2 {
      text-align: center;
    }
    .extras-container label {
      display: block;
      margin: 5px 0;
      font-size: 1.1em;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 1.2em;
      width: 100%;
    }
    button:hover {
      background-color: #45a049;
    }
    #sending-image {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.7);
    }
    #precioTotal {
      font-size: 1.5em;
      font-weight: bold;
      margin-top: 10px;
      text-align: left;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="../../index.html">
        <img src="../../Imagenes/Iconos/Icono INICIO.jpg" alt="Volver">
      </a>
    </div>
    <div>
      Sandwich<br>Tostada Atun
    </div>
  </header>

  <a href="javascript:history.back()">
    <img src="../../Imagenes/Iconos/Icono Regresar.png" alt="Regresar atrás" class="back-button">
  </a>

  <div class="content-container">
    <div class="image-container">
      <img src="../Sandwiches o Tostadas/Sandwich Atun.jpg" alt="Sandwich Atun">
    </div>
    <div class="extras-container">
      <h2>Elige tus ingredientes:</h2>
      <label><input type="checkbox" id="queso"> Queso</label>
      <label><input type="checkbox" id="cebolla"> Cebolla</label>
      <label><input type="checkbox" id="Mayonesa"> Mayonesa</label><br>
      <div id="precioTotal">-</div>
      <button onclick="agregarAlCarrito()">Agregar al Carrito</button>
    </div>
  </div>

  <img id="sending-image" src="../../Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito">

  <a href="../../Carrito.html">
    <img src="../../Imagenes/Iconos/Carrito.png" alt="Ver Carrito" class="cart-icon">
  </a>

  <script>
    const PRECIO_BASE = 3.40;
    const combinacionesPrecios = {
      "Queso": 0.20,
      "Cebolla": 0.20,
      "Mayonesa": 0.00,
      "Queso,Cebolla": 0.40,
      "Queso,Mayonesa": 0.20,
      "Cebolla,Mayonesa": 0.20,
      "Queso,Cebolla,Mayonesa": 0.40
    };

    function calcularPrecio() {
      const opcion1 = document.getElementById("queso").checked ? "Queso" : "";
      const opcion2 = document.getElementById("cebolla").checked ? "Cebolla" : "";
      const opcion3 = document.getElementById("Mayonesa").checked ? "Mayonesa" : "";
      const seleccionados = [opcion1, opcion2, opcion3].filter(Boolean).join(",");
      const precioExtras = combinacionesPrecios[seleccionados] ?? 0;
      const precioTotal = PRECIO_BASE + precioExtras;
      document.getElementById("precioTotal").textContent = precioTotal.toFixed(2) + " €";
    }

    document.querySelectorAll("input[type=checkbox]").forEach(checkbox => {
      checkbox.addEventListener('change', calcularPrecio);
    });

    function agregarAlCarrito() {
      const precioNumerico = parseFloat(document.getElementById("precioTotal").textContent.replace(" €", ""));
      if (isNaN(precioNumerico)) {
        alert("Error al obtener el precio.");
        return;
      }

      const ingredientesSeleccionados = [];
      document.querySelectorAll("input[type=checkbox]:checked").forEach(checkbox => {
        ingredientesSeleccionados.push(checkbox.id.charAt(0).toUpperCase() + checkbox.id.slice(1));
      });

      let carrito = JSON.parse(localStorage.getItem('Carrito')) || [];
      let producto = {
        nombre: "Sandwich o tostada ATUN",
        extras: ingredientesSeleccionados.length > 0 ? ingredientesSeleccionados : [""],
        precioBase: PRECIO_BASE,
        precioTotal: precioNumerico
      };

      carrito.push(producto);
      localStorage.setItem('Carrito', JSON.stringify(carrito));
      mostrarImagenEnvio();
    }

    function mostrarImagenEnvio() {
      let sendingImage = document.getElementById("sending-image");
      sendingImage.style.display = "block";
      setTimeout(() => {
        sendingImage.style.display = "none";
      }, 1000);
    }

    window.onload = function() {
      document.querySelectorAll("input[type=checkbox]").forEach(cb => cb.checked = false);
      calcularPrecio();
    };
  </script>
</body>
</html>
```
