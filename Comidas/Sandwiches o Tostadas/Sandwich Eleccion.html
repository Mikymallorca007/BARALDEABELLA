<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAR ALDEA BELLA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .header-left {
            position: absolute;
            left: -10px;
            display: flex;
            align-items: center;
        }
        .header-left img {
            width: 40px;
            height: auto;
            margin-right: 5px;
            position: relative;
            top: -5px;
        }
        .content-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 30px;
        }
        .image-container {
            flex: 1;
            text-align: center;
            margin-top: 20px;
        }
        .image-container img {
            width: 150px;
            height: auto;
            border-radius: 10px;
            margin-top: -40px;
        }
        .extras-container {
            flex: 1;
            background: #f8f8f8;
            padding: 20px;
            border-radius: 10px;
            text-align: left;
            max-width: 300px;
        }
        .extras-container h2 {
            text-align: center;
        }
        .extras-container label {
            display: block;
            margin: 5px 0;
            font-size: 1.1em;
        }
        .back-button {
            width: 40px;  /* Tamaño fijo */
            height: auto; /* Mantiene la proporción */
            position: absolute;
            top: 150px;  /* Ajuste de posición */
            left: 20px; /* Ajuste de posición */
        }
        button {
            background-color: #4CAF50; /* Color de fondo verde */
            color: white; /* Texto blanco */
            border: none; /* Sin borde */
            padding: 10px 20px; /* Espaciado interno */
            cursor: pointer; /* Cambia el cursor cuando pasa sobre el botón */
            border-radius: 5px; /* Bordes redondeados */
            font-size: 1.2em; /* Tamaño de fuente */
        }

        button:hover {
            background-color: #45a049; /* Color de fondo cuando se pasa el cursor (verde más oscuro) */
        }
        #sending-image {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.7);
        }
        .cart-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        #precioTotal {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="../../Index.html">
                <img src="../../Imagenes/Iconos/Icono INICIO.jpg" alt="Volver" class="back-button">
            </a>
        </div>
        <div>
            Sandwich<br>o Tostada
        </div>
    </header>

    <a href="javascript:history.back()">
        <img src="../../Imagenes/Iconos/Icono Regresar.png" alt="Regresar atrás" class="back-button">
    </a>

    <div class="content-container">
        <div class="image-container">
            <img src="../Sandwiches o Tostadas/Sandwich Eleccion.jpg" alt="Sandwich o Tostada">
        </div>
        <div class="extras-container">
            <h2>Elige tus ingredientes:</h2>
            <label><input type="checkbox" id="york"> York</label>
            <label><input type="checkbox" id="queso"> Queso</label>
            <label><input type="checkbox" id="cebola"> Cebolla</label>
            <label><input type="checkbox" id="tomate"> Tomate</label><br>

            <div id="precioTotal">-</div>

            <button onclick="agregarAlCarrito()">Agregar al Carrito</button>
        </div>
    </div>

    <img id="sending-image" src="../../Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito">

    <a href="../../Carrito.html">
        <img src="../../Imagenes/Iconos/Carrito.png" alt="Ver Carrito" class="cart-icon">
    </a>

<script>
    // Precio base sin extras
    const PRECIO_BASE = 0.00;

    // Combinaciones y precios adicionales válidos
    const combinacionesPrecios = {
        "York": 2.00,
        "Queso": 2.00,
        "Cebolla": 0.00,
        "Tomate": 0.00,
        "York,Queso": 2.00,
        "York,Cebolla": 2.00,
        "York,Tomate": 2.00,
        "Queso,Cebolla": 2.00,
        "Queso,Tomate": 2.00,
        "Cebolla,Tomate": 0.00,
        "York,Queso,Cebolla": 2.20,
        "York,Queso,Tomate": 2.20,
        "York,Cebolla,Tomate": 2.20,
        "Queso,Cebolla,Tomate": 2.20,
        "York,Queso,Cebolla,Tomate": 2.40
    };
// Función que calcula el precio total con base + extras
function calcularPrecio() {
    const opcion1 = document.getElementById("york").checked ? "York" : "";
    const opcion2 = document.getElementById("queso").checked ? "Queso" : "";
    const opcion3 = document.getElementById("cebola").checked ? "Cebolla" : "";
    const opcion4 = document.getElementById("tomate").checked ? "Tomate" : "";

    const seleccionados = [opcion1, opcion2, opcion3, opcion4].filter(item => item).join(",");

    // Precio extra basado en la combinación seleccionada
    let precioExtras = combinacionesPrecios[seleccionados] !== undefined ? combinacionesPrecios[seleccionados] : 0;

    // Precio total = precio base + precio de los extras
    let precioTotal = PRECIO_BASE + precioExtras;

    // Mostrar el precio total
    document.getElementById("precioTotal").textContent = precioTotal.toFixed(2) + " €";

    // Verificar si la combinación es "Solo Tomate", "Solo Cebolla" o "Cebolla y Tomate"
    if (seleccionados === "Cebolla" || seleccionados === "Tomate" || seleccionados === "Cebolla,Tomate") {
        mostrarAviso(seleccionados);
        deshabilitarBoton();
    } else {
        ocultarAviso();
        habilitarBoton();
    }
}

// Mostrar mensaje de aviso
function mostrarAviso(combinacion) {
    let avisoDiv = document.getElementById("aviso");
    if (!avisoDiv) {
        avisoDiv = document.createElement("div");
        avisoDiv.id = "aviso";
        avisoDiv.style.color = "red";
        avisoDiv.style.marginTop = "10px";
        avisoDiv.style.fontSize = "1.2em";
        document.querySelector(".extras-container").appendChild(avisoDiv);
    }

    let mensaje = "";

    if (combinacion === "Cebolla") {
        mensaje = "Has seleccionado solo Cebolla, esta combinación no es válida. ¿Seguro que quieres continuar?";
    } else if (combinacion === "Tomate") {
        mensaje = "Has seleccionado solo Tomate, esta combinación no es válida. ¿Seguro que quieres continuar?";
    } else if (combinacion === "Cebolla,Tomate") {
        mensaje = "Has seleccionado Cebolla y Tomate, esta combinación no es válida. ¿Seguro que quieres continuar?";
    }

    avisoDiv.textContent = mensaje;
}

// Ocultar mensaje de aviso
function ocultarAviso() {
    let avisoDiv = document.getElementById("aviso");
    if (avisoDiv) {
        avisoDiv.remove();
    }
}

// Deshabilitar el botón "Agregar al Carrito"
function deshabilitarBoton() {
    document.querySelector("button").disabled = true;
}

// Habilitar el botón "Agregar al Carrito"
function habilitarBoton() {
    document.querySelector("button").disabled = false;
}

// Detectar cambios en los checkboxes y recalcular el precio
document.querySelectorAll("input[type=checkbox]").forEach(checkbox => {
    checkbox.addEventListener('change', calcularPrecio);
});

// Función para agregar al carrito (mismo código de antes)
function agregarAlCarrito() {
    const precioTotal = document.getElementById("precioTotal").textContent;

    // Extraer el valor numérico del precio
    const precioNumerico = parseFloat(precioTotal.replace(" €", ""));

    if (isNaN(precioNumerico)) {
        alert("Error al obtener el precio.");
        return;
    }

    // Obtener ingredientes seleccionados
    const ingredientesSeleccionados = [];
    document.querySelectorAll("input[type=checkbox]:checked").forEach(checkbox => {
        ingredientesSeleccionados.push(checkbox.id.charAt(0).toUpperCase() + checkbox.id.slice(1)); 
    });

    let carrito = JSON.parse(localStorage.getItem('Carrito')) || [];
    
    let producto = {
        nombre: "Sandwich o tostada",
        extras: ingredientesSeleccionados.length > 0 ? ingredientesSeleccionados : ["Sin extras"],  // Cambiado a 'extras'
        precioBase: PRECIO_BASE,            // Precio base
        precioTotal: precioNumerico         // Precio total con extras
    };

    carrito.push(producto);
    localStorage.setItem('Carrito', JSON.stringify(carrito));

    console.log("Carrito después de agregar:", carrito);  // Ver el carrito después de agregar

    // Mostrar la imagen de envío al carrito
    mostrarImagenEnvio();
}

function mostrarImagenEnvio() {
    let sendingImage = document.getElementById("sending-image");
    sendingImage.style.display = "block";
    setTimeout(() => { 
        sendingImage.style.display = "none"; 
    }, 1000);
}

</script>

</body>
</html>
