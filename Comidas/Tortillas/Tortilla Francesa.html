<!-- Tortilla Francesa con estilo visual igualado al modelo de Tostadas Bacon (+) -->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tortilla Francesa</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      text-align: center;
    }
    header {
      background-color: #E60012;
      color: white;
      padding: 20px;
      font-size: 2em;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .header-left {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .header-left img {
      width: 40px;
      height: auto;
    }
    .back-button {
      position: absolute;
      top: 20px;
      right: 20px;
    }
    .back-button img {
      width: 40px;
      height: auto;
      cursor: pointer;
    }
    .content-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      padding: 30px;
    }
    .image-container {
      flex: 1;
      text-align: center;
      margin-top: 20px;
    }
    .image-container img {
      width: 150px;
      height: auto;
      border-radius: 10px;
      margin-top: -40px;
    }
    .extras-container {
      flex: 1;
      background: #f8f8f8;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
      max-width: 300px;
    }
    .extras-container h2 {
      text-align: center;
    }
    .extras-container label {
      display: block;
      margin: 5px 0;
      font-size: 1.1em;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 1.2em;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    #sending-image {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.7);
    }
    #precioTotal {
      font-size: 1.5em;
      font-weight: bold;
      text-align: left;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <a href="../../index.html">
        <img src="../../Imagenes/Iconos/Icono INICIO.jpg" alt="Inicio" />
      </a>
    </div>
    <div>
      Tortilla<br>Francesa
    </div>
    <div class="back-button">
      <a href="javascript:history.back()">
        <img src="../../Imagenes/Iconos/Icono Regresar.png" alt="Regresar atrás" />
      </a>
    </div>
  </header>

  <div class="content-container">
    <div class="image-container">
      <img src="../../Comidas/Tortillas/Tortilla Francesa.jpg" alt="Tortilla Francesa" />
    </div>
    <div class="extras-container">
      <h2>Elige tus ingredientes extra:</h2>
      <label><input type="checkbox" id="extra1"> York - 0,80€</label>
      <label><input type="checkbox" id="extra2"> Bacon - 1,00€</label>
      <label><input type="checkbox" id="extra3"> Champiñon - 1,00€</label>
      <label><input type="checkbox" id="extra4"> Queso - 0,80€</label>
      <label><input type="checkbox" id="extra5"> Tomate - 0,30€</label>
      <label><input type="checkbox" id="extra6"> Cebolla - 0,30€</label>
      <div id="precioTotal">0.00€</div>
      <button onclick="agregarAlCarrito()">Agregar al Carrito</button>
    </div>
  </div>

  <img id="sending-image" src="../../Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito" />

  <script>
    const PRECIO_BASE = 5.00;

    function calcularPrecio() {
      let precioExtras = 0;
      if (document.getElementById("extra1").checked) precioExtras += 0.80;
      if (document.getElementById("extra2").checked) precioExtras += 1.00;
      if (document.getElementById("extra3").checked) precioExtras += 1.00;
      if (document.getElementById("extra4").checked) precioExtras += 0.80;
      if (document.getElementById("extra5").checked) precioExtras += 0.30;
      if (document.getElementById("extra6").checked) precioExtras += 0.30;
      const precioTotal = PRECIO_BASE + precioExtras;
      document.getElementById("precioTotal").textContent = precioTotal.toFixed(2) + " €";
    }

    document.querySelectorAll("input[type=checkbox]").forEach(cb => {
      cb.addEventListener('change', calcularPrecio);
    });

    function agregarAlCarrito() {
      const producto = "Tortilla Francesa";
      let extras = [];
      let precioExtras = 0;
      if (document.getElementById("extra1").checked) { extras.push("York"); precioExtras += 0.80; }
      if (document.getElementById("extra2").checked) { extras.push("Bacon"); precioExtras += 1.00; }
      if (document.getElementById("extra3").checked) { extras.push("Champiñon"); precioExtras += 1.00; }
      if (document.getElementById("extra4").checked) { extras.push("Queso"); precioExtras += 0.80; }
      if (document.getElementById("extra5").checked) { extras.push("Tomate"); precioExtras += 0.30; }
      if (document.getElementById("extra6").checked) { extras.push("Cebolla"); precioExtras += 0.30; }

      const precioTotal = PRECIO_BASE + precioExtras;
      const item = {
        nombre: producto,
        extras: extras,
        precioBase: PRECIO_BASE,
        precioTotal: precioTotal
      };

      const Carrito = JSON.parse(localStorage.getItem('Carrito')) || [];
      Carrito.push(item);
      localStorage.setItem('Carrito', JSON.stringify(Carrito));
      mostrarImagenEnvio();
      deseleccionarExtras();
    }

    function mostrarImagenEnvio() {
      const img = document.getElementById("sending-image");
      img.style.display = "block";
      setTimeout(() => {
        img.style.display = "none";
      }, 1000);
    }

    function deseleccionarExtras() {
      document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
    }

    window.onload = function() {
      deseleccionarExtras();
      calcularPrecio();
    };
  </script>
</body>
</html>
```
