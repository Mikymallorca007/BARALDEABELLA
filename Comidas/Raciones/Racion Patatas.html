<!-- Versión corregida para “Ración Patatas” sin icono del carrito y con botón de inicio correctamente alineado -->

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAR ALDEA BELLA</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      text-align: center;
    }
    header {
      background-color: #E60012;
      color: white;
      padding: 20px;
      font-size: 2em;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .header-left, .back-button-header {
      position: absolute;
      top: 20px;
    }
    .header-left {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .header-left img {
      width: 40px;
      height: auto;
    }
    .back-button-header {
      right: 20px;
    }
    .back-button-header img {
      width: 40px;
      height: auto;
    }
    .content-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      padding: 30px;
    }
    .image-container {
      flex: 1;
      text-align: center;
      margin-top: 20px;
    }
    .image-container img {
      width: 150px;
      height: auto;
      border-radius: 10px;
      margin-top: -40px;
    }
    .extras-container {
      flex: 1;
      background: #f8f8f8;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
      max-width: 300px;
    }
    .extras-container h2 {
      text-align: center;
      margin-bottom: 10px;
    }
    .extras-container label {
      display: block;
      margin: 6px 0;
      font-size: 1.1em;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 1.2em;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    #sending-image {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.7);
    }
    #precioTotal {
      font-size: 1.5em;
      font-weight: bold;
      text-align: left;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <a href="../../index.html">
      <img src="../../Imagenes/Iconos/Icono INICIO.jpg" alt="Inicio" />
    </a>
  </div>
  <div>Ración<br>Patatas (*)</div>
  <div class="back-button-header">
    <a href="javascript:history.back()">
      <img src="../../Imagenes/Iconos/Icono Regresar.png" alt="Regresar atrás" />
    </a>
  </div>
</header>

<div class="content-container">
  <div class="image-container">
    <img src="../Raciones/Racion Patatas.jpg" alt="Ración Patatas" />
  </div>
  <div class="extras-container">
    <h2>Elige tus ingredientes extra:</h2>
    <label><input type="checkbox" id="extra1" onchange="calcularPrecio()"> Salsa Curry - 1,00€</label>
    <label><input type="checkbox" id="extra2" onchange="calcularPrecio()"> Queso Fundido - 1,00€</label>

    <div id="precioTotal">3,00 €</div>
    <button onclick="agregarAlCarrito()">Agregar al Carrito</button>
  </div>
</div>

<img id="sending-image" src="../../Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito" />

<script>
  const PRECIO_BASE = 3.00;

  function calcularPrecio() {
    let precioExtras = 0;
    if (document.getElementById("extra1").checked) precioExtras += 1.00;
    if (document.getElementById("extra2").checked) precioExtras += 1.00;

    const total = PRECIO_BASE + precioExtras;
    document.getElementById("precioTotal").textContent = total.toFixed(2) + " €";
  }

  function agregarAlCarrito() {
    const producto = "Ración Patatas";
    const extras = [];
    if (document.getElementById("extra1").checked) extras.push("Salsa Curry");
    if (document.getElementById("extra2").checked) extras.push("Queso Fundido");

    const precioTotal = parseFloat(document.getElementById("precioTotal").textContent.replace(" €", ""));
    const item = {
      nombre: producto,
      extras: extras.length ? extras : ["-"],
      precioTotal: precioTotal
    };

    const carrito = JSON.parse(localStorage.getItem('Carrito')) || [];
    carrito.push(item);
    localStorage.setItem('Carrito', JSON.stringify(carrito));

    mostrarImagenEnvio();
    setTimeout(() => {
      document.getElementById("extra1").checked = false;
      document.getElementById("extra2").checked = false;
      calcularPrecio();
    }, 1000);
  }

  function mostrarImagenEnvio() {
    document.getElementById("sending-image").style.display = "block";
    setTimeout(() => {
      document.getElementById("sending-image").style.display = "none";
    }, 1000);
  }

  window.onload = calcularPrecio;
</script>

</body>
</html>
