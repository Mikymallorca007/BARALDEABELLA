<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAR ALDEA BELLA</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .header-left {
            position: absolute;
            left: -10px;
            display: flex;
            align-items: center;
        }
        .header-left img {
            width: 40px;
            height: auto;
            margin-right: 5px;
            position: relative;
            top: -5px;
        }
        .content-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            padding: 30px;
        }
        .image-container {
            flex: 1;
            text-align: center;
            margin-top: 15px;
        }
        .image-container img {
            width: 150px;
            height: auto;
            border-radius: 10px;
            margin-top: -40px;
        }
        .extras-container {
            flex: 1;
            background: #f8f8f8;
            padding: 10px;
            border-radius: 10px;
            text-align: left;
            max-width: 300px;
        }
        .extras-container h2 {
         text-align: center;
         margin-top: 2px; /* Reducido para subir los títulos */
        }
        .extras-container label {
            display: block;
            margin: 5px 0;
            font-size: 1.1em;
        }
        .back-button {
            width: 40px;
            height: auto;
            position: absolute;
            top: 150px;
            left: 20px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.2em;
        }
        button:hover {
            background-color: #45a049;
        }
        #sending-image {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.7);
        }
        .cart-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        #precioTotal {
            font-size: 1.5em;
            font-weight: bold;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="../../index.html">
            <img src="../../Imagenes/Iconos/Icono INICIO.jpg" alt="Volver" class="back-button">
        </a>
    </div>
    <div>
        Pizza<br>Pollo y Piña
    </div>
</header>

<a href="javascript:history.back()">
    <img src="../../Imagenes/Iconos/Icono Regresar.png" alt="Regresar atrás" class="back-button">
</a>

<div class="content-container">
    <div class="image-container">
        <img src="../Pizzas/Pizza Pollo y Piña.jpg" alt="Pizza Pollo y Piña">
    </div>
    <div class="extras-container">
        <h2>Elije tus ingredientes extras:</h2>
        <label><input type="checkbox" class="ingrediente" data-precio="1.00" value="Cebolla">         Cebolla</label>
        <label><input type="checkbox" class="ingrediente" data-precio="1.00" value="Champiñon">          Champiñón</label>
        <label><input type="checkbox" class="ingrediente" data-precio="1.00" value="Pimiento">          Pimiento</label>            
        <label><input type="checkbox" class="ingrediente" data-precio="1.50" value="Bacon"> Bacon</label>
        <label><input type="checkbox" class="ingrediente" data-precio="1.00" value="Maiz Dulce"> Maiz Dulce</label>
             
<div style="text-align: right;">
    <label for="tamano">Tamaño: 
        <select id="tamano" onchange="calcularPrecio()">
            <option value="Mediana" data-precio="13.50">M</option>
            <option value="Grande" data-precio="16.00">Grande</option>
        </select>
    </label>

    <label style="margin-top: 5px;">
        <input type="checkbox" id="paraLlevar" data-precio="0.40" onchange="calcularPrecio()"> Para llevar (+0.40)
    </label>
</div>
        <label style="display: block; margin-top: 20px;">
            <div id="precioTotal">12.00 €</div>
            <button onclick="agregarAlCarrito()">Agregar al Carrito</button>
        </label>
    </div>
</div>

<img id="sending-image" src="../../Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito">

<a href="../../Carrito.html">
    <img src="../../Imagenes/Iconos/Carrito.png" alt="Ver Carrito" class="cart-icon">
</a>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        limpiarSeleccion();
        document.querySelectorAll(".ingrediente, #paraLlevar").forEach(checkbox => {
            checkbox.addEventListener("change", calcularPrecio);
        });
    });

    function calcularPrecio() {
        let tamano = document.getElementById("tamano");
        let precioBase = parseFloat(tamano.options[tamano.selectedIndex].getAttribute("data-precio"));
        let precioExtras = 0;
        
        document.querySelectorAll(".ingrediente:checked").forEach(checkbox => {
            precioExtras += parseFloat(checkbox.getAttribute("data-precio"));
        });
        
        let extraCaja = document.getElementById("paraLlevar").checked ? 0.40 : 0;
        let precioTotal = precioBase + precioExtras + extraCaja;
        
        document.getElementById("precioTotal").textContent = precioTotal.toFixed(2) + " €";
    }

    function agregarAlCarrito() {
        const producto = "Pizza Pollo y Piña";
        let extras = [];
        
        document.querySelectorAll(".ingrediente:checked").forEach(checkbox => {
            extras.push(checkbox.value);
        });

        let tamanoSeleccionado = document.getElementById("tamano");
        let tamanoTexto = tamanoSeleccionado.options[tamanoSeleccionado.selectedIndex].text;

        if (document.getElementById("paraLlevar").checked) {
            extras.push("Para llevar (+0.40)");
        }

       if (extras.length === 0) {
            extras.push("-");
        }

        let precioTotal = parseFloat(document.getElementById("precioTotal").textContent);

        let carrito = JSON.parse(localStorage.getItem('Carrito')) || [];
        carrito.push({ nombre: `${producto} - ${tamanoTexto}`, extras, precioTotal });
        localStorage.setItem('Carrito', JSON.stringify(carrito));

        mostrarImagenEnvio();  // Muestra la imagen de envío al carrito
        limpiarSeleccion();
    }

    function mostrarImagenEnvio() {
        let sendingImage = document.getElementById("sending-image");
        sendingImage.style.display = "block"; 
        setTimeout(() => { 
            sendingImage.style.display = "none"; 
        }, 1000);  // La imagen se oculta después de 1 segundo
    }

    function limpiarSeleccion() {
        document.querySelectorAll(".ingrediente, #paraLlevar").forEach(checkbox => checkbox.checked = false);
        document.getElementById("tamano").value = "Mediana";
        calcularPrecio();
    }

    window.onload = limpiarSeleccion;
</script>

</body>
</html>
