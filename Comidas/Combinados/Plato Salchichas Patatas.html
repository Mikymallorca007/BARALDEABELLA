<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAR ALDEA BELLA</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      text-align: center;
    }
    header {
      background-color: #E60012;
      color: white;
      padding: 20px;
      font-size: 2em;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .go-home-button {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .go-home-button img {
      width: 50px;
      height: 50px;
      cursor: pointer;
    }
    .back-button {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .back-button img {
      width: 50px;
      height: 50px;
      cursor: pointer;
    }
    .content-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      padding: 30px;
    }
    .image-container {
      flex: 1;
      text-align: center;
      margin-top: 20px;
    }
    .image-container img {
      width: 150px;
      height: auto;
      border-radius: 10px;
      margin-top: -40px;
    }
    .extras-container {
      flex: 1;
      background: #f8f8f8;
      padding: 20px;
      border-radius: 10px;
      text-align: left;
      max-width: 300px;
    }
    .extras-container h2 {
      text-align: center;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 1.2em;
      width: 100%;
    }
    button:hover {
      background-color: #45a049;
    }
    #sending-image {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1000;
      background-color: rgba(0, 0, 0, 0.7);
    }
    #precioTotal {
      font-size: 1.5em;
      font-weight: bold;
      text-align: left;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header>
    <a href="../../index.html" class="go-home-button">
      <img src="../../Imagenes/Iconos/Icono INICIO.jpg" alt="Volver al Inicio">
    </a>
    <div>
      Salchichas
    </div>
    <div class="back-button">
      <a href="javascript:history.back()">
        <img src="../../Imagenes/Iconos/Icono Regresar.png" alt="Volver atrás">
      </a>
    </div>
  </header>

  <div class="content-container">
    <div class="image-container">
      <img src="../../Comidas/Combinados/Plato Salchichas Patatas.jpg" alt="Salchichas">
    </div>
    <div class="extras-container">
      <h2>Salchichas con Patatas.</h2>
      <div id="precioTotal">5,00 €</div>
      <button onclick="agregarAlCarrito()">Agregar al Carrito</button>
    </div>
  </div>

  <img id="sending-image" src="../../Imagenes/Enviando a carrito.jpeg" alt="Enviando al carrito">

  <script>
    const PRECIO_BASE = 5.00;

    function calcularPrecio() {
      document.getElementById("precioTotal").textContent = PRECIO_BASE.toFixed(2) + " €";
    }

    function agregarAlCarrito() {
      const item = {
        nombre: "Salchichas con Patatas",
        extras: ["Sin extras"],
        precioBase: PRECIO_BASE,
        precioTotal: PRECIO_BASE
      };

      const Carrito = JSON.parse(localStorage.getItem("Carrito")) || [];
      Carrito.push(item);
      localStorage.setItem("Carrito", JSON.stringify(Carrito));

      mostrarImagenEnvio();
    }

    function mostrarImagenEnvio() {
      const img = document.getElementById("sending-image");
      img.style.display = "block";
      setTimeout(() => {
        img.style.display = "none";
      }, 1000);
    }

    window.onload = calcularPrecio;
  </script>

</body>
</html>
