<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Aldea Bella - Inicio</title> <!-- Título de la página -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
        }
        header {
            background-color: #E60012;
            color: white;
            text-align: center;
            padding: 20px;
            font-size: 2.5em;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cart-container {
            position: absolute;
            right: 10px; /* Carrito alineado a la derecha */
            top: 50%;
            transform: translateY(-50%);
        }
        .cart-icon {
            width: 50px;
            height: 50px;
            cursor: pointer;
        }
        .hero {
            text-align: center;
            padding: 50px;
            background-image: url('Imagenes/Imagen Cabecera Index.jpeg');
            background-size: cover;
            color: white;
        }
        .button {
            background-color: #FFC72C;
            color: black;
            padding: 15px 30px;
            text-decoration: none;
            font-size: 1.5em;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
        }
        .menu-section {
            text-align: center;
            padding: 50px;
            display: flex; /* Esto alinea las categorías horizontalmente */
            justify-content: center; /* Centra las categorías */
            gap: 20px; /* Espacio entre las categorías */
        }
        .category {
            text-align: center;
            width: 150px; /* Ajusta el tamaño de cada categoría */
        }
        .category a {
            text-decoration: none;
            color: black;
            font-size: 1.5em;
            font-weight: bold;
            display: block;
        }
        .category img {
            width: 60px;
            height: 60px;
            margin-bottom: 10px;
        }
        footer {
            background-color: #E60012;
            color: white;
            text-align: center;
            padding: 10px;
        }
    </style>
</head>
<body>
    <header>
        Bar<br> Aldea Bella
        <div class="cart-container">
            <a href="Carrito.html">
                <img src="Imagenes/Iconos/Carrito.png" alt="Ver Carrito" class="cart-icon">
            </a>
        </div>
    </header>

    <div class="hero">
        <h1>Bienvenidos a Bar Aldea Bella</h1>
        <p>Disfruta de nuestras deliciosas hamburguesas y platos combinados.</p>
    </div>
    
    <div class="menu-section">
        <div class="category">
            <a href="Comidas.html">
                <img src="Imagenes/Iconos/Icono Comida.png" alt="Comidas">
                Comidas
            </a>
        </div>
        <div class="category">
            <a href="bebidas.html">
                <img src="Imagenes/Iconos/Icono Bebidas.png" alt="Bebidas">
                Bebidas
            </a>
        </div>
        <div class="category">
            <a href="helados.html">
                <img src="Imagenes/Iconos/Icono Helados.png" alt="Helados">
                Helados
            </a>
        </div>
    </div>
    
    <footer>&copy; 2025 Bar Aldea Bella | Todos los derechos reservados</footer>
</body>
</html>
