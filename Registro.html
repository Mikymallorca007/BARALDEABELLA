<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Solicitar Alta – Bar Aldea Bella</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      text-align: center;
    }
    header {
      background-color: #E60012;
      color: white;
      padding: 20px;
      position: relative;
      font-size: 1.5em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .home-button {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
    }
    .home-button img {
      width: 40px;
      height: 40px;
      cursor: pointer;
    }
    .form-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 40px 20px;
      max-width: 400px;
      margin: 0 auto;
    }
    .form-container h1 {
      margin-bottom: 20px;
      font-size: 1.8em;
      color: #333;
    }
    .form-group {
      margin-bottom: 15px;
      text-align: left;
    }
    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .form-group input:invalid {
      border-color: #e74c3c;
    }
    .note {
      font-size: 0.9em;
      color: #777;
      margin-top: -10px;
      margin-bottom: 10px;
    }
    .whatsapp-button {
      background-color: #25D366;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 1.1em;
      border-radius: 5px;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
      width: 100%;
    }
    .whatsapp-button:disabled {
      background-color: #a5d6a7;
      cursor: not-allowed;
    }
    footer {
      background-color: #E60012;
      color: white;
      padding: 10px;
      font-size: 0.9em;
    }
    input#apartamento {
      max-width: 40px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="home-button">
      <img src="Imagenes/Iconos/Icono INICIO.jpg" alt="Inicio"/>
    </a>
    Solicitar Alta
  </header>

  <div class="form-container">
    <h1>Crear solicitud de cuenta</h1>
    <form id="solicitud-form" novalidate>
      <div class="form-group">
        <label for="nombre">Nombre real</label>
        <input type="text" id="nombre" name="nombre" required placeholder="Tu nombre completo"/>
      </div>

      <div class="form-group">
        <label for="apartamento">Número de apartamento</label>
        <input type="text" id="apartamento" name="apartamento" required placeholder="Apt."/>
      </div>

      <div class="form-group">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" required placeholder="Usuario deseado"/>
      </div>

      <div class="form-group">
        <label for="password">Contraseña (6 dígitos)</label>
        <input type="password" id="password" name="password" required pattern="\d{6}" maxlength="6" placeholder="La contraseña debe tener exactamente 6 dígitos."/>
      </div>

      <button type="submit" id="whatsapp-btn" class="whatsapp-button" disabled>
        Enviar por WhatsApp
      </button>
    </form>
  </div>

  <footer>&copy; 2025 Bar Aldea Bella | Todos los derechos reservados</footer>

  <script>
    const campos = {
      nombre: document.getElementById('nombre'),
      apartamento: document.getElementById('apartamento'),
      usuario: document.getElementById('usuario'),
      password: document.getElementById('password')
    };

    const btn = document.getElementById('whatsapp-btn');
    const form = document.getElementById('solicitud-form');

    // Mayúsculas automáticas en el campo nombre
    campos.nombre.addEventListener('input', () => {
      campos.nombre.value = campos.nombre.value.toUpperCase();
      validarFormulario();
    });

    // Limitar a 3 caracteres numéricos y validar rangos permitidos
    campos.apartamento.addEventListener('input', () => {
      let val = campos.apartamento.value.replace(/\D/g, '').slice(0, 3);
      campos.apartamento.value = val;
      validarFormulario();
    });

    function apartamentoValido() {
      const valor = parseInt(campos.apartamento.value, 10);
      return (
        (valor >= 1 && valor <= 50) ||
        (valor >= 101 && valor <= 115) ||
        (valor >= 201 && valor <= 215)
      );
    }

    function passwordValida() {
      return /^\d{6}$/.test(campos.password.value.trim());
    }

    function validarFormulario() {
      const todosCompletos = Object.values(campos).every(c => c.value.trim() !== '');
      const apartamentoOK = apartamentoValido();
      const passwordOK = passwordValida();

      if (!apartamentoOK && campos.apartamento.value.trim() !== '') {
        campos.apartamento.setCustomValidity("Número de apartamento no válido.");
      } else {
        campos.apartamento.setCustomValidity("");
      }

      if (!passwordOK && campos.password.value.trim() !== '') {
        campos.password.setCustomValidity("La contraseña debe tener exactamente 6 dígitos.");
      } else {
        campos.password.setCustomValidity("");
      }

      btn.disabled = !(todosCompletos && apartamentoOK && passwordOK);
    }

    Object.values(campos).forEach(c => c.addEventListener('input', validarFormulario));

    form.addEventListener('submit', e => {
      e.preventDefault();
      if (btn.disabled) return;

      const mensaje =
        `Solicitud de alta:\n` +
        `Nombre: ${campos.nombre.value.trim()}\n` +
        `Apartamento: ${campos.apartamento.value.trim()}\n` +
        `Usuario: ${campos.usuario.value.trim()}\n` +
        `Contraseña: ${campos.password.value.trim()}`;

      const link = 'https://wa.me/34652399666?text=' + encodeURIComponent(mensaje);
      window.open(link, '_blank');

      // Limpiar formulario
      form.reset();
      btn.disabled = true;

      // Redirigir después de 1.5 segundos
      setTimeout(() => {
        window.location.href = 'Carrito.html';
      }, 1500);
    });
  </script>
</body>
</html>
