<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fff;
            text-align: center;
        }
        header {
            background-color: #E60012;
            color: white;
            padding: 10px 20px;
            font-size: 2em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .home-button {
            width: 50px;
            height: 50px;
            cursor: pointer;
        }
        .header-text {
            flex: 1;
            text-align: center;
        }
        .cart-clear {
            position: absolute;
            right: 20px;
            width: 40px;
            height: 40px;
            cursor: pointer;
        }
        .cart-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        .cart-item {
            width: 100%;
            border-bottom: 1px solid #ccc;
            padding: 10px 0;
            display: flex;
            justify-content: space-between;
        }
        .cart-item .item-info {
            flex: 1;
            text-align: left;
        }
        .cart-item .item-price {
            text-align: right;
            width: 120px;
        }
        button {
            background-color: #E60012;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1.2em;
            margin-top: 20px;
        }
        button:hover {
            background-color: #B5000F;
        }
        .whatsapp-button {
            background-color: #25D366;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            font-size: 1.2em;
            margin-top: 20px;
            display: inline-block;
            text-decoration: none;
        }
        .whatsapp-button:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html">
            <img src="Imagenes/Icono INICIO.jpg" alt="Inicio" class="home-button">
        </a>
        <div class="header-text">Carrito de Compras</div>
        <img src="Imagenes/eliminarCarrito.png" alt="Vaciar carrito" class="cart-clear" onclick="vaciarCarrito()">
    </header>

    <div class="cart-container">
        <div id="cart-items"></div>

        <button onclick="continuarComprando()">Continuar Comprando</button>

        <a id="whatsapp-link" href="#" class="whatsapp-button" target="_blank">
            Enviar por WhatsApp
        </a>
    </div>

    <script>
        let Carrito = JSON.parse(localStorage.getItem('Carrito')) || [];

        function mostrarCarrito() {
            const cartItemsContainer = document.getElementById('cart-items');
            cartItemsContainer.innerHTML = ''; 
            let totalPedido = 0; 
            let detallePedido = ''; 

            if (Carrito.length === 0) {
                cartItemsContainer.innerHTML = '<p>No tienes productos en el Carrito.</p>';
            } else {
                Carrito.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.classList.add('cart-item');

                    const itemInfo = document.createElement('div');
                    itemInfo.classList.add('item-info');
                    itemInfo.innerHTML = `<strong>${item.nombre}</strong><br>Extras: ${item.extras.join(', ')}`;

                    const itemPrice = document.createElement('div');
                    itemPrice.classList.add('item-price');
                    itemPrice.innerHTML = `${item.precioTotal.toFixed(2)}€`;

                    itemDiv.appendChild(itemInfo);
                    itemDiv.appendChild(itemPrice);
                    cartItemsContainer.appendChild(itemDiv);

                    detallePedido += `${item.nombre} - Extras: ${item.extras.join(', ')} - Precio: ${item.precioTotal.toFixed(2)}€\n`;

                    totalPedido += item.precioTotal; 
                });
            }

            const mensaje = `¡Hola! Quiero hacer un pedido.\n\n${detallePedido}\nTotal: ${totalPedido.toFixed(2)}€`;

            const whatsappLink = document.getElementById('whatsapp-link');
            whatsappLink.href = `https://wa.me/34652399666?text=${encodeURIComponent(mensaje)}`;
        }

        function vaciarCarrito() {
            localStorage.removeItem('Carrito'); // Eliminar el carrito del almacenamiento local
            Carrito = []; // Limpiar la variable Carrito en el script
            mostrarCarrito(); // Mostrar el carrito vacío en la página
        }

        function continuarComprando() {
            window.location.href = "../../index.html"; // Redirigir manualmente en lugar de usar history.back()
        }

        window.onload = function () {
            if (!sessionStorage.getItem("reloaded")) {
                sessionStorage.setItem("reloaded", "true");
                window.location.reload();
            } else {
                sessionStorage.removeItem("reloaded");
            }
            mostrarCarrito();
        };
    </script>
</body>
</html>
