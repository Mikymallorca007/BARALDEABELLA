<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mi pedido</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet"/>
  <style>
    /* (Todo tu estilo original sin cambios) */
    /* ... */
    body { font-family: 'Roboto', sans-serif; margin: 0; padding: 0; background-color: #fff; text-align: center; }
    header { background-color: #E60012; color: white; padding: 10px 20px; font-size: 2em; display: flex; align-items: center; justify-content: space-between; }
    .home-button { width: 50px; height: 50px; cursor: pointer; }
    .header-text { flex: 1; text-align: center; }
    .cart-clear { position: absolute; right: 20px; width: 40px; height: 40px; cursor: pointer; }
    .cart-container { display: flex; flex-direction: column; align-items: center; padding: 30px; }
    .cart-item { width: 100%; border-bottom: 1px solid #ccc; padding: 10px 0; display: flex; justify-content: space-between; }
    .cart-item .item-info { flex: 1; text-align: left; }
    .cart-item .item-price { text-align: right; width: 120px; }
    #total-carrito { font-size: 1.3em; margin-top: 20px; font-weight: bold; }
    button { background-color: #E60012; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-size: 1.2em; margin-top: 20px; }
    button:hover { background-color: #B5000F; }
    .whatsapp-button { background-color: #25D366; color: white; padding: 12px 25px; border-radius: 5px; font-size: 1.2em; margin-top: 20px; display: inline-block; text-decoration: none; }
    .whatsapp-button:hover { background-color: #128C7E; }
    #login-container { margin-top: 30px; }
    input { padding: 10px; font-size: 1em; width: 200px; }
    #usuario-info { margin-top: 20px; font-size: 1.1em; }
    .mensaje { padding: 10px 15px; border-radius: 5px; margin-bottom: 10px; width: 100%; max-width: 400px; margin-left: auto; margin-right: auto; font-size: 1em; }
    .mensaje.exito { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .mensaje.error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
  </style>
</head>
<body>

<header>
  <a href="index.html">
    <img src="Imagenes/Iconos/Icono INICIO.jpg" alt="Inicio" class="home-button">
  </a>
  <div class="header-text">Mi pedido</div>
  <img src="Imagenes/Iconos/Eliminar Carrito.png" alt="Vaciar carrito" class="cart-clear" onclick="vaciarCarrito()">
</header>

<div class="cart-container">
  <div id="cart-items"></div>
  <div id="total-carrito"></div>

  <button onclick="continuarComprando()">Continuar Comprando</button>

  <div id="mensaje-login"></div>

  <div id="login-container">
    <h3>Iniciar sesión para enviar pedido</h3>
    <input type="text" id="usuario" placeholder="Usuario" required><br><br>
    <input type="password" id="contrasena" placeholder="Contraseña" required><br><br>
    <button onclick="iniciarSesion()">Iniciar Sesión</button>
  </div>

  <div id="usuario-info" style="display: none;">
    <p>👤 Sesión iniciada como <strong id="nombre-usuario"></strong></p>
    <button onclick="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <a href="#" id="whatsapp-link" class="whatsapp-button" style="display:none">
    Enviar pedido por WhatsApp
  </a>

  <a href="Registro.html" id="boton-registro" class="whatsapp-button">
    Registrarse para hacer pedidos
  </a>
</div>

<!-- 🔁 Cargar usuarios.js SIN caché automáticamente -->
<script>
  const script = document.createElement("script");
  script.src = "usuarios.js?v=" + new Date().getTime();
  document.head.appendChild(script);

  script.onload = function () {
    let Carrito = JSON.parse(localStorage.getItem('Carrito')) || [];

    function mostrarCarrito() {
      const cartItemsContainer = document.getElementById('cart-items');
      const totalCarrito = document.getElementById('total-carrito');
      cartItemsContainer.innerHTML = '';
      let totalPedido = 0;
      let detallePedido = '';

      if (Carrito.length === 0) {
        cartItemsContainer.innerHTML = '<p>No tienes productos en el Carrito.</p>';
        totalCarrito.textContent = '';
      } else {
        Carrito.forEach((item, index) => {
          const itemDiv = document.createElement('div');
          itemDiv.classList.add('cart-item');

          const itemInfo = document.createElement('div');
          itemInfo.classList.add('item-info');
          itemInfo.innerHTML = `<strong>${item.nombre}</strong><br>Extras: ${item.extras.join(', ')}`;

          const itemPrice = document.createElement('div');
          itemPrice.classList.add('item-price');
          itemPrice.innerHTML = `
            ${item.precioTotal.toFixed(2)}€<br>
            <button onclick="eliminarItem(${index})" style="margin-top:5px;font-size:0.9em;">🗑️</button>
          `;

          itemDiv.appendChild(itemInfo);
          itemDiv.appendChild(itemPrice);
          cartItemsContainer.appendChild(itemDiv);

          detallePedido += `${item.nombre} - Extras: ${item.extras.join(', ')} - Precio: ${item.precioTotal.toFixed(2)}€\n`;
          totalPedido += item.precioTotal;
        });

        totalCarrito.textContent = `Total del carrito: ${totalPedido.toFixed(2)}€`;
      }

      const mensaje = `¡Hola! Quiero hacer un pedido.\n\n${detallePedido}\nTotal: ${totalPedido.toFixed(2)}€`;
      const whatsappLink = document.getElementById('whatsapp-link');
      whatsappLink.href = `https://wa.me/34652399666?text=${encodeURIComponent(mensaje)}`;
    }

    function vaciarCarrito() {
      if (confirm("¿Estás seguro de que deseas vaciar el carrito completo?")) {
        localStorage.removeItem('Carrito');
        Carrito = [];
        mostrarCarrito();
        setTimeout(() => {
          window.location.reload(true);
        }, 100);
      }
    }

    function eliminarItem(index) {
      if (index >= 0 && index < Carrito.length) {
        const confirmar = confirm("¿Estás seguro de que deseas eliminar este producto?");
        if (confirmar) {
          Carrito.splice(index, 1);
          localStorage.setItem('Carrito', JSON.stringify(Carrito));
          mostrarCarrito();
        }
      }
    }

    function continuarComprando() {
      window.history.back();
    }

    function verificarSesion() {
      const usuarioLogeado = localStorage.getItem('usuarioLogeado');
      const whatsappBtn = document.getElementById('whatsapp-link');
      const loginContainer = document.getElementById('login-container');
      const usuarioInfo = document.getElementById('usuario-info');
      const nombreUsuario = document.getElementById('nombre-usuario');
      const botonRegistro = document.getElementById('boton-registro');

      if (usuarioLogeado) {
        whatsappBtn.style.display = 'inline-block';
        loginContainer.style.display = 'none';
        usuarioInfo.style.display = 'block';
        nombreUsuario.textContent = usuarioLogeado;
        botonRegistro.style.display = 'none';
      } else {
        whatsappBtn.style.display = 'none';
        loginContainer.style.display = 'block';
        usuarioInfo.style.display = 'none';
        nombreUsuario.textContent = '';
        botonRegistro.style.display = 'inline-block';
      }
    }

    function mostrarMensaje(tipo, texto) {
      const contenedor = document.getElementById('mensaje-login');
      contenedor.innerHTML = `<div class="mensaje ${tipo}">${texto}</div>`;
      setTimeout(() => {
        contenedor.innerHTML = '';
      }, 3000);
    }

    function iniciarSesion() {
      const usuarioInputElement = document.getElementById('usuario');
      const contrasenaInputElement = document.getElementById('contrasena');

      const usuario = usuarioInputElement.value.trim();
      const contrasena = contrasenaInputElement.value.trim();

      const usuarioValido = usuariosValidos.find(u => 
        u.usuario === usuario && u.contrasena === contrasena
      );

      if (usuarioValido) {
        localStorage.setItem('usuarioLogeado', usuario);
        mostrarMensaje("exito", "¡Inicio de sesión exitoso!");
        verificarSesion();
      } else {
        mostrarMensaje("error", "Usuario o contraseña incorrectos.");
      }

      // 🔄 Limpia campos después del intento
      usuarioInputElement.value = "";
      contrasenaInputElement.value = "";
    }

    function cerrarSesion() {
      localStorage.removeItem('usuarioLogeado');
      verificarSesion();
      setTimeout(() => {
        window.location.href = "index.html";
      }, 1500);
    }

    window.onload = function () {
      mostrarCarrito();
      verificarSesion();
    };
  };
</script>

</body>
</html>
